<!-- The Token Manager:
    You are developing a user authentication system, and you need to manage user authentication tokens. Implement a function named setAuthToken that takes an authentication token and sets it in localStorage with an expiration time. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Token Manager</title>
</head>
<body>
    <script>
        let token = prompt("Enter your authentication token");

        function setAuthToken(token) {
            localStorage.setItem("Token", token);
            // a + (b-a) * r gives random time between a and b
            let randomExpireTime = 3 + 5 * Math.random();
            setTimeout(() => {
                localStorage.removeItem("Token")
                console.log("Your token expired in " + randomExpireTime.toFixed(2) + " seconds");
            }, randomExpireTime*1000);
        }
        setAuthToken(token)
    </script>
</body>
</html>
