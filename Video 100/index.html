<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Layout</title>

    <link rel="stylesheet" href="src/output.css">
</head>
<body class="flex justify-center items-center m-30 bg-neutral-800">
    <div class="container flex gap-2 p-5 text-white bg-neutral-900">
        <div class="thumbnailContainer relative">
            <div class="image w-45">
                <img class="rounded-xl " src="img/hqdefault.webp" alt="thumbnail">
            </div>
            <div class="duration absolute bottom-1 right-2 font-bold bg-neutral-800 rounded-sm text-white text-sm px-1 ">31:20</div>
        </div>
        <div class="textContainer flex flex-col ">
          <div class="title text-xl font-bold">
              Installing VS Code & How Websites Work | Sigma Web Development Course - Tutorial #1
        </div>
        <div class="description text-sm font-medium text-neutral-400">
            <span>CodeWithHarry</span>
            <span class="text-2xl">.</span>
            <span>931K views</span>
            <span class="text-2xl">.</span>
            <span>3 months ago</span>
        </div>
        </div>
    </div>
</body>
</html>
